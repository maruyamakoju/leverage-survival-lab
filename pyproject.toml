[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leverage-survival-lab"
version = "0.1.0"
description = "100倍レバレッジ生存率の実証研究 — モンテカルロ・バックテスト基盤"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Leverage Survival Lab" }]
keywords = ["quant", "backtest", "leverage", "crypto", "monte-carlo", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",  # pandas 3.0.x にセグフォルト不具合がある(list-of-dict 構築)
    "pyarrow>=15",
    "duckdb>=0.10",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "ccxt>=4.2",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "tenacity>=8.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.99",
    "ruff>=0.3",
    "mypy>=1.9",
    "black>=24.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]
fast = [
    # JIT・ベクトル化系。Windows でビルド失敗することがあるためオプトイン
    "numba>=0.59",
    "vectorbt>=0.26",
]
agent = [
    # Claude Code 自律実行で使う MLflow 等(任意)
    "mlflow>=2.11",
]

[project.urls]
Homepage = "https://github.com/maruyamakoju/leverage-survival-lab"
Issues = "https://github.com/maruyamakoju/leverage-survival-lab/issues"

[project.scripts]
lsl-fetch = "leverage_survival_lab.data.fetch:main"
lsl-backtest = "leverage_survival_lab.backtest.cli:main"
lsl-trade = "leverage_survival_lab.trading.cli:main"
lsl-web = "leverage_survival_lab.web.app:run"
lsl-ai-trader = "leverage_survival_lab.trading.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: 実行に時間のかかるテスト",
    "integration: 結合テスト",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line too long
    "RUF001", # 日本語 × (MULTIPLICATION SIGN) を許容
    "RUF002",
    "RUF003",
    "N806",   # 大文字変数 L (leverage の慣例) を許容
    "UP042",  # str+Enum 二重継承 (StrEnum 移行は後回し)
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
