<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レバレッジ生存ラボ — ペーパートレード</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="root">

  <header>
    <div class="brand">
      <div class="title">レバレッジ生存ラボ</div>
      <div class="subtitle">仮想金で BTC をバンバン触る — Binance リアル価格</div>
    </div>
    <div class="conn">
      <span id="conn-dot" class="dot offline"></span>
      <span id="conn-text">接続中…</span>
    </div>
  </header>

  <main>

    <!-- Price + chart -->
    <section class="card price-card">
      <div class="row">
        <div class="symbol">BTC/USDT</div>
        <div id="price" class="price">—</div>
        <div id="price-change" class="change">—</div>
      </div>
      <canvas id="price-chart" height="120"></canvas>
      <div class="ts" id="ts">—</div>
    </section>

    <!-- Account -->
    <section class="card account-card">
      <div class="row">
        <div class="label">残高</div>
        <div id="equity" class="big">$ —</div>
        <div id="pnl" class="pnl">—</div>
      </div>
      <div class="bar"><div id="liq-bar" class="bar-fill"></div></div>
      <div class="row sub">
        <div>初期: <span id="init-eq">—</span></div>
        <div>含み損益: <span id="unr">—</span></div>
        <div>取引数: <span id="n-trades">0</span></div>
        <div>清算回数: <span id="n-liq">0</span></div>
      </div>
    </section>

    <!-- Position -->
    <section class="card position-card" id="position-card">
      <div class="label">ポジション</div>
      <div id="pos-display" class="pos-flat">ノーポジ</div>
      <div id="pos-detail" class="row sub" style="display:none;">
        <div>数量: <span id="pos-qty"></span></div>
        <div>建値: <span id="pos-entry"></span></div>
        <div>レバ: <span id="pos-lev"></span></div>
        <div>清算価格: <span id="pos-liq"></span> <small id="pos-liq-dist"></small></div>
      </div>
    </section>

    <!-- Trade controls -->
    <section class="card controls-card">
      <div class="row controls-row">
        <label>サイズ%
          <input id="inp-size" type="number" min="1" max="100" step="1" value="50">
        </label>
        <label>レバ
          <input id="inp-lev" type="number" min="1" max="125" step="1" value="10">
        </label>
        <label>損切%
          <input id="inp-sl" type="number" min="0" max="50" step="0.1" placeholder="なし">
        </label>
        <label>利確%
          <input id="inp-tp" type="number" min="0" max="100" step="0.1" placeholder="なし">
        </label>
        <button id="btn-set-sl" class="btn-mini">損切セット</button>
        <button id="btn-set-tp" class="btn-mini">利確セット</button>
        <button id="btn-clear-sl" class="btn-mini">損切クリア</button>
        <button id="btn-clear-tp" class="btn-mini">利確クリア</button>
      </div>
      <div class="row controls-row big-buttons">
        <button id="btn-long" class="btn-long">▲ 買い</button>
        <button id="btn-close" class="btn-close">決済</button>
        <button id="btn-short" class="btn-short">▼ 売り</button>
      </div>
      <div id="precheck" class="precheck">—</div>
      <div id="last-msg" class="last-msg">—</div>
    </section>

    <!-- Trade history -->
    <section class="card history-card">
      <div class="label">取引履歴</div>
      <table id="trades-table">
        <thead>
          <tr><th>時刻</th><th>種別</th><th>価格</th><th>数量</th><th>レバ</th><th>損益</th></tr>
        </thead>
        <tbody id="trades-body"></tbody>
      </table>
    </section>

    <!-- Reset -->
    <section class="card reset-card">
      <details>
        <summary>セッションリセット(初期残高変更)</summary>
        <div class="row" style="margin-top:8px;">
          <label>初期残高($)
            <input id="reset-eq" type="number" min="1000" step="1000" value="1000000">
          </label>
          <button id="btn-reset" class="btn-mini">リセット</button>
        </div>
      </details>
    </section>

  </main>

  <!-- Liquidation modal -->
  <div id="liq-modal" class="modal hidden">
    <div class="modal-content">
      <h2>💀 清算されました</h2>
      <p id="liq-text">清算価格でポジションが消滅しました。</p>
      <button id="liq-ok" class="btn-mini">了解</button>
    </div>
  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
